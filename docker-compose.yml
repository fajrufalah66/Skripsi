services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cikadongdong-app
    ports:
      - "8080:80"
    environment:
      APP_URL: ${APP_URL}
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY}
      WHATSAPP_DEVICE_KEY: ${WHATSAPP_DEVICE_KEY}
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: cikadongdong-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-3.sql:/docker-entrypoint-initdb.d/db-3.sql:ro

volumes:
  mysql_data:
